<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Pequenos Discípulos · Catequese em Família</title>
    <meta name="description" content="Catequese católica gamificada para toda a família: crianças, jovens e adultos." />
    <link rel="icon" type="image/png" href="./icons/icon-192.png?v=0a378cd2" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=0a378cd2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Discípulos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Aplica o modo escuro/contraste antes do React (evita piscar claro). O resto é feito em src/lib/theme.ts.
      try {
        var d = JSON.parse(localStorage.getItem('pequenos_discipulos_data') || '{}');
        var p = (d.profiles || []).filter(function (x) { return x && x.id === d.activeProfileId; })[0];
        var m = p && p.appearance && p.appearance.mode;
        if (m === 'auto') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        if (m) document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
